<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels shablon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--bp:#17325C;--paper:#F3C94B;--ink:#17325C;--white:#F4F6FA;--alarm:#E4572E;--ok:#3FB68B;--page:#0B1A31;--bar:#2B4C7E}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Onest",system-ui,sans-serif}
body.render{display:block}
#wrap{position:relative;width:540px;height:960px;transform-origin:center center;flex:none}
#stage{position:absolute;inset:0;background:var(--bp);overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px}
.scene{position:absolute;inset:0;opacity:0;color:var(--white)}
.disp{font-family:"Unbounded","Onest",sans-serif}
p{margin:0}
.col{display:flex;flex-direction:column;justify-content:center;padding:0 40px}
em{font-style:normal;color:var(--paper)}

.hook .h1{font-size:34px;font-weight:600;line-height:1.2}
.hook .h2{font-size:60px;font-weight:800;line-height:1.02;margin-top:14px;color:var(--paper)}
.hook .h2 span{display:inline-block}
.hook .stamp{position:absolute;right:40px;bottom:220px;border:5px solid var(--alarm);color:var(--alarm);font-size:40px;font-weight:800;padding:8px 22px;border-radius:6px;transform:rotate(-10deg);max-width:420px}

.number .i1{font-size:30px;font-weight:600;line-height:1.25;max-width:440px}
.number .num{font-size:230px;font-weight:800;line-height:.9;color:var(--paper);margin-top:18px;white-space:nowrap}
.number .i2{font-size:40px;font-weight:800;margin-top:6px}

.card{position:absolute;left:40px;right:40px;top:110px;height:420px;opacity:0}
.card .cnt{font-size:18px;font-weight:600;color:var(--paper);letter-spacing:.02em}
.card .n{font-size:92px;font-weight:800;line-height:1;color:var(--paper);margin-top:6px}
.card .t{font-size:36px;font-weight:800;line-height:1.12;margin-top:14px}
.card .d{font-size:22px;line-height:1.4;opacity:.85;margin-top:14px;max-width:440px}
.res{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:12px;background:var(--white);color:var(--ink);border-radius:6px;padding:14px 18px;font-weight:700;font-size:20px;max-width:100%}
.res i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ok);position:relative}
.res i::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg)}
.res small{display:block;font-size:14px;font-weight:600;opacity:.6}
.card.hl .res{background:var(--paper)}
.barw{position:absolute;left:0;bottom:80px;width:100%;height:320px}
.bar{position:absolute;bottom:0;background:var(--bar);border-radius:4px 4px 0 0;transform-origin:bottom;display:flex;justify-content:center;padding-top:8px;color:rgba(255,255,255,.75);font-weight:700;font-size:18px}
.bar.on{background:var(--white);color:var(--ink)}
.bar.cur{background:var(--paper);color:var(--ink)}
.base{position:absolute;left:30px;right:30px;bottom:78px;height:3px;background:rgba(255,255,255,.5)}
.flag{position:absolute;width:170px;background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;padding:9px 12px;border-radius:5px;opacity:0}
.flag::after{content:"";position:absolute;left:var(--lx,84px);top:100%;width:2px;height:var(--line,48px);background:var(--paper)}

.statement .r1{font-size:30px;font-weight:600}
.statement .r2{font-size:52px;font-weight:800;line-height:1.05;margin-top:16px}

.cta .c1{font-size:46px;font-weight:800;line-height:1.08}
.cta .c2{font-size:24px;margin-top:28px;opacity:.9}
.cta .dm{margin-top:48px;display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:999px;padding:14px 26px;font-size:22px;font-weight:700}
.cta .dm b{font-family:"Unbounded",sans-serif;font-weight:800}
.cta .sig{margin-top:70px;border-top:2px solid rgba(255,255,255,.35);padding-top:18px}
.cta .sig .nm{font-size:24px;font-weight:700}
.cta .sig .rl{font-size:18px;opacity:.8;margin-top:3px}

#pbar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--paper);transform-origin:left;transform:scaleX(0)}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div class="grid"></div><div id="scenes"></div><div id="pbar"></div></div></div>
<script>
// Namuna ma'lumot: sahifani brauzerda to'g'ridan-to'g'ri ochganda ko'rinadi
const DEMO = {
  signature: { name: 'Joʻrabek', role: 'Biznesni tizimga solaman' },
  scenes: [
    { type: 'hook', top: "Lavozim yo'riqnomasini birinchi yozsangiz", accent: 'pulingiz kuyadi', stamp: 'Bu xato' },
    { type: 'number', text: "Funksiyalar aniqlangach, to'g'ri ketma-ketlik:", num: '4', label: 'qadam' },
    { type: 'steps', highlight: 2, flag: "Yo'riqnoma shu yerda", items: [
      { title: 'Funksiyalarni tekshirish', desc: 'Kerakli va takrorlanadigan ishlarni ajratamiz.', result: "Ishlar ro'yxati" },
      { title: 'Rollar va org sxema', desc: "Funksiyalarni rollarga yig'amiz.", result: 'Boshqaruv tuzilmasi' },
      { title: 'Ish standartlari', desc: 'Qanday bajarish va natija mezonini yozamiz.', result: "Qisqa yo'riqnoma" },
      { title: 'Nazorat', desc: 'Natijani solishtiramiz va tuzatamiz.', result: 'Barqaror tizim' }
    ] },
    { type: 'statement', small: "Ko'rdingizmi?", big: "Yo'riqnoma faqat 3-qadamda keladi.", accent: '3-qadamda' },
    { type: 'cta', text: 'Biznesingiz nechanchi qadamda turibdi?', sub: 'Izohda raqamini yozing', keyword: 'TIZIM' }
  ]
};

const RENDER = !!window.__DATA__;
const DATA = window.__DATA__ || DEMO;
const root = document.getElementById('scenes');

// Kichik yordamchilar: matn doim textContent orqali qo'yiladi (HTML in'ektsiyasi yo'q)
function el(tag, cls, text, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
// "big" matnidagi "accent" bo'lagini sariq rang bilan ajratadi
function withAccent(parent, text = '', accent = '') {
  const i = accent ? text.indexOf(accent) : -1;
  if (i < 0) { parent.textContent = text; return; }
  parent.append(text.slice(0, i)); el('em', null, accent, parent); parent.append(text.slice(i + accent.length));
}
// Matn sig'masa shriftni kichraytiradi
function fit(e, maxH, maxW) {
  let fs = parseFloat(getComputedStyle(e).fontSize);
  while (fs > 12 && (e.scrollHeight > maxH || (maxW && e.scrollWidth > maxW))) { fs -= 2; e.style.fontSize = fs + 'px'; }
}

const tl = gsap.timeline({ paused: true, onUpdate: () => gsap.set('#pbar', { scaleX: tl.progress() }) });
let t = 0;
// Dublyaj: sahna/qadam ovozining boshlanish vaqtlari (vk → soniya). Ovoz uzun bo'lsa sahna cho'ziladi
const marks = {};
const span = (base, o, pad) => Math.max(base, o && o.dur ? o.dur + pad : 0);
const mark = (o, at) => { if (o && o.vk) marks[o.vk] = at; };

const builders = {
  hook(s) {
    const sc = el('section', 'scene col hook', null, root);
    const h1 = el('p', 'h1', s.top, sc);
    const h2 = el('p', 'h2 disp', null, sc);
    (s.accent || '').split(' ').forEach((w, i) => { if (i) h2.append(' '); el('span', null, w, h2); });
    fit(h1, 170); fit(h2, 260);
    const st = s.stamp ? el('div', 'stamp disp', s.stamp, sc) : null;
    tl.set(sc, { opacity: 1 }, t)
      .from(h1, { y: 30, opacity: 0, duration: .5, ease: 'power3.out' }, t + .1)
      .from(h2.children, { y: 80, opacity: 0, stagger: .15, duration: .5, ease: 'back.out(2)' }, t + .5);
    if (st) tl.to(h2, { color: '#E4572E', duration: .25 }, t + 1.4)
      .fromTo(st, { scale: 2.4, opacity: 0, rotation: -25 }, { scale: 1, opacity: 1, rotation: -10, duration: .35, ease: 'power4.in' }, t + 2.1)
      .to('#stage', { x: 6, duration: .05, yoyo: true, repeat: 5 }, t + 2.45);
    const D = span(4, s, .8); mark(s, t + .3);
    tl.to(sc, { opacity: 0, duration: .35 }, t + D - .35);
    return D;
  },
  number(s) {
    const sc = el('section', 'scene col number', null, root);
    const i1 = el('p', 'i1', s.text, sc);
    const num = el('p', 'num disp', s.num, sc);
    const i2 = el('p', 'i2 disp', s.label, sc);
    fit(i1, 230); fit(num, 220, 460);
    tl.set(sc, { opacity: 1 }, t)
      .from(i1, { y: 30, opacity: 0, duration: .5, ease: 'power3.out' }, t + .05)
      .from(num, { scale: 0, opacity: 0, duration: .6, ease: 'back.out(2.5)', transformOrigin: 'left center' }, t + .6)
      .from(i2, { x: -30, opacity: 0, duration: .4 }, t + 1);
    const D = span(3, s, .6); mark(s, t + .2);
    tl.to(sc, { opacity: 0, y: -40, duration: .4 }, t + D - .4);
    return D;
  },
  steps(s) {
    const items = (s.items || []).slice(0, 8), n = items.length;
    const Ds = items.map(it => span(3, it, .6)), starts = Ds.map((_, i) => Ds.slice(0, i).reduce((a, b) => a + b, 0));
    const hl = Number.isInteger(s.highlight) && s.highlight >= 0 && s.highlight < n ? s.highlight : -1;
    const sc = el('section', 'scene steps', null, root);
    const barw = el('div', 'barw', null, sc);
    el('div', 'base', null, sc);
    const gap = 8, bw = Math.min(90, (460 - gap * (n - 1)) / n);
    const x0 = (540 - (n * bw + (n - 1) * gap)) / 2; // ustunlar markazda
    const cards = [], bars = [];
    items.forEach((it, i) => {
      const c = el('div', 'card' + (i === hl ? ' hl' : ''), null, sc);
      el('p', 'cnt', `Qadam ${i + 1} / ${n}`, c);
      el('p', 'n disp', String(i + 1).padStart(2, '0'), c);
      const title = el('p', 't disp', it.title, c);
      const d = el('p', 'd', it.desc, c);
      fit(title, 90); fit(d, 100);
      if (it.result) { const r = el('div', 'res', null, c); el('i', null, null, r); const w = el('div', null, null, r); el('small', null, 'Natija', w); w.append(it.result); }
      cards.push(c);
      const b = el('div', 'bar', String(i + 1), barw);
      b.style.left = (x0 + i * (bw + gap)) + 'px'; b.style.width = bw + 'px';
      b.style.height = (44 + i * (240 / Math.max(n - 1, 1))) + 'px';
      bars.push(b);
    });
    let flag = null;
    if (hl >= 0 && s.flag) {
      flag = el('div', 'flag', s.flag, sc);
      const cx = x0 + hl * (bw + gap) + bw / 2, fx = Math.max(10, Math.min(360, cx - 85));
      flag.style.left = fx + 'px';
      flag.style.setProperty('--lx', (cx - fx - 1) + 'px');
      // Bayroqcha kartadagi "Natija" blokiga tegmasin: balandlik chegaralangan, chiziq qisqaradi
      const barTop = 80 + parseFloat(bars[hl].style.height);
      const bottom = Math.min(barTop + 56, 372);
      flag.style.bottom = bottom + 'px';
      flag.style.setProperty('--line', Math.max(0, bottom - barTop - 6) + 'px');
    }
    tl.set(sc, { opacity: 1 }, t).from(bars, { scaleY: 0, duration: .5, stagger: .04, ease: 'power3.out' }, t);
    items.forEach((it, i) => {
      const at = t + starts[i], D = Ds[i], c = cards[i];
      mark(it, at + .2);
      tl.fromTo(c, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, at + .1)
        .call(() => bars.forEach((b, j) => { b.classList.toggle('cur', j === i); b.classList.toggle('on', j < i); }), null, at + .1)
        .fromTo(bars[i], { scaleY: 1 }, { scaleY: 1.08, duration: .18, yoyo: true, repeat: 1 }, at + .1)
        .to(c, { opacity: 0, y: -40, duration: .35, ease: 'power2.in' }, at + D - .35);
      const res = c.querySelector('.res');
      if (res) tl.from(res, { opacity: 0, y: 20, duration: .4, ease: 'power3.out' }, at + 1);
      if (i === hl && flag) tl.fromTo(flag, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: .4, ease: 'back.out(2)' }, at + 1.3);
    });
    const end = t + Ds.reduce((a, b) => a + b, 0);
    tl.call(() => bars.forEach((b, j) => { b.classList.toggle('on', j !== hl); b.classList.toggle('cur', j === hl); }), null, end);
    if (hl >= 0) tl.to(bars.filter((_, j) => j !== hl), { opacity: .35, duration: .4 }, end + .1)
      .fromTo(bars[hl], { scaleY: 1 }, { scaleY: 1.15, duration: .3, yoyo: true, repeat: 3, ease: 'sine.inOut' }, end + .1);
    tl.to(sc, { opacity: 0, duration: .4 }, end + 1.1);
    return end - t + 1.5;
  },
  statement(s) {
    const sc = el('section', 'scene col statement', null, root);
    const r1 = s.small ? el('p', 'r1', s.small, sc) : null;
    const r2 = el('p', 'r2 disp', null, sc); withAccent(r2, s.big, s.accent);
    fit(r2, 420);
    tl.set(sc, { opacity: 1 }, t);
    if (r1) tl.from(r1, { y: 30, opacity: 0, duration: .5, ease: 'power3.out' }, t + .05);
    const D = span(3.5, s, .6); mark(s, t + .2);
    tl.from(r2, { y: 30, opacity: 0, duration: .5, ease: 'power3.out' }, t + .4)
      .to(sc, { opacity: 0, duration: .4 }, t + D - .4);
    return D;
  },
  cta(s) {
    const sc = el('section', 'scene col cta', null, root);
    const c1 = el('p', 'c1 disp', s.text, sc);
    fit(c1, 260);
    const c2 = s.sub ? el('p', 'c2', s.sub, sc) : null;
    let dm = null;
    if (s.keyword) { dm = el('div', 'dm', 'Direktga yozing: ', sc); el('b', null, s.keyword, dm); }
    const sig = el('div', 'sig', null, sc);
    el('div', 'nm', DATA.signature?.name || '', sig); el('div', 'rl', DATA.signature?.role || '', sig);
    tl.set(sc, { opacity: 1 }, t).from(c1, { y: 30, opacity: 0, duration: .5, ease: 'power3.out' }, t);
    if (c2) tl.from(c2, { opacity: 0, y: 20, duration: .4 }, t + 1);
    if (dm) tl.from(dm, { scale: .6, opacity: 0, duration: .45, ease: 'back.out(2)' }, t + 1.8);
    tl.from(sig, { opacity: 0, y: 20, duration: .4 }, t + 2.6);
    mark(s, t + .2);
    return span(6, s, 1.5);
  }
};

async function build() {
  // Shriftlar faqat ishlatilganda yuklanadi, shuning uchun o'lchashdan oldin majburan yuklaymiz
  if (document.fonts) {
    const faces = ['400 16px Onest', '600 16px Onest', '700 16px Onest', '500 16px Unbounded', '800 16px Unbounded'];
    await Promise.all(faces.map(f => document.fonts.load(f, 'Oʻzbek').catch(() => {})));
    await document.fonts.ready;
  }
  for (const s of DATA.scenes || []) {
    const b = builders[s.type];
    if (b) t += b(s);
  }
  tl.to({}, { duration: .01 }, t); // oxirgi kadr to'liq uzunlikda bo'lsin
  return t;
}

if (RENDER) {
  document.body.classList.add('render');
  // Render: server vaqtni o'zi boshqaradi (kadrma-kadr)
  window.__ready = build();
  window.__seek = (sec) => { tl.seek(sec, false); };
  window.__marks = marks;
} else {
  const wrap = document.getElementById('wrap');
  const scale = () => { wrap.style.transform = 'scale(' + Math.min(innerWidth / 540, innerHeight / 960) * .98 + ')'; };
  addEventListener('resize', scale); scale();
  build().then(() => tl.play());
}
</script>
</body>
</html>
