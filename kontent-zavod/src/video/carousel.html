<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karusel shablon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bp:#17325C;--paper:#F3C94B;--ink:#17325C;--white:#F4F6FA;--alarm:#E4572E;--ok:#3FB68B;--page:#0B1A31;--bar:#2B4C7E}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:"Onest",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 16px}
body.render{padding:0;gap:0;display:block}
p{margin:0}
.disp{font-family:"Unbounded","Onest",sans-serif}
em{font-style:normal;color:var(--paper)}

.slide{position:relative;width:540px;height:675px;flex:none;background:var(--bp);color:var(--white);overflow:hidden}
body.render .slide{position:absolute;left:0;top:0;visibility:hidden}
body.render .slide.on{visibility:visible}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px}
.body{position:absolute;left:40px;right:40px;top:48px;bottom:96px;display:flex;flex-direction:column;justify-content:center}
.foot{position:absolute;left:40px;right:40px;bottom:32px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;opacity:.85}
.foot .pg{font-family:"Unbounded",sans-serif;font-weight:800;color:var(--paper)}
.swipe{position:absolute;right:40px;bottom:72px;font-size:16px;font-weight:700;color:var(--paper)}

.cover .kick{display:inline-block;align-self:flex-start;background:var(--paper);color:var(--ink);font-weight:700;font-size:16px;padding:6px 12px;border-radius:4px}
.cover .title{font-size:44px;font-weight:800;line-height:1.08;margin-top:22px}
.cover .accent{font-size:44px;font-weight:800;line-height:1.08;color:var(--paper);margin-top:6px}

.point .n{font-size:96px;font-weight:800;line-height:1;color:var(--paper)}
.point .t{font-size:34px;font-weight:800;line-height:1.12;margin-top:18px}
.point .d{font-size:22px;line-height:1.45;opacity:.9;margin-top:18px}

.list .t{font-size:32px;font-weight:800;line-height:1.12}
.list ul{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.list li{display:flex;gap:14px;align-items:flex-start;font-size:21px;line-height:1.35}
.list li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);position:relative;margin-top:1px}
.list li i::after{content:"";position:absolute;left:8px;top:7px;width:10px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg)}

.stat .num{font-size:150px;font-weight:800;line-height:.95;color:var(--paper);white-space:nowrap}
.stat .lbl{font-size:30px;font-weight:800;margin-top:8px}
.stat .d{font-size:22px;line-height:1.45;opacity:.9;margin-top:22px}

.quote .mark{font-size:120px;line-height:.6;color:var(--paper);font-weight:800}
.quote .q{font-size:32px;font-weight:800;line-height:1.2;margin-top:18px}
.quote .by{font-size:18px;opacity:.8;margin-top:18px}

.cta .t{font-size:40px;font-weight:800;line-height:1.1}
.cta .sub{font-size:22px;opacity:.9;margin-top:22px}
.cta .dm{margin-top:34px;display:inline-flex;align-self:flex-start;gap:10px;background:var(--paper);color:var(--ink);border-radius:999px;padding:14px 24px;font-size:21px;font-weight:700}
.cta .dm b{font-family:"Unbounded",sans-serif;font-weight:800}
.cta .sig{margin-top:44px;border-top:2px solid rgba(255,255,255,.35);padding-top:16px}
.cta .sig .nm{font-size:22px;font-weight:700}
.cta .sig .rl{font-size:17px;opacity:.8;margin-top:3px}
</style>
</head>
<body>
<script>
// Namuna: sahifani brauzerda ochganda barcha slaydlar ketma-ket ko'rinadi
const DEMO = {
  signature: { name: 'Joʻrabek', role: 'Biznesni tizimga solaman' },
  slides: [
    { type: 'cover', kicker: 'Rahbar uchun', title: "Xodim o'zboshimcha ishlayaptimi?", accent: '5 ta sabab' },
    { type: 'point', title: "Vazifa yozma emas", text: "Og'zaki topshiriq 2 kunda unutiladi. Yozilgan vazifa — nazorat qilinadigan vazifa." },
    { type: 'list', title: "Ertaga boshlang", items: ['Har lavozimga 1 sahifa yo\'riqnoma', 'Haftalik 15 daqiqalik hisobot', 'Bitta mas\'ul — bitta natija'] },
    { type: 'stat', num: '3×', label: 'tezroq', text: "Standart yozilgan jarayonni yangi xodim shuncha tez o'rganadi." },
    { type: 'quote', text: "Tizim bor joyda rahbar ozod.", by: 'Joʻrabek' },
    { type: 'cta', text: 'Qaysi sabab sizda bor?', sub: 'Izohda raqamini yozing', keyword: 'TIZIM' }
  ]
};
const RENDER = !!window.__DATA__;
const DATA = window.__DATA__ || DEMO;
if (RENDER) document.body.classList.add('render');

function el(tag, cls, text, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
// Matn sig'masa shriftni kichraytiradi (butun slayd tanasi bo'yicha)
function fitBody(body, els) {
  for (let k = 0; k < 40 && body.scrollHeight > body.clientHeight; k++) {
    for (const e of els) {
      if (!e) continue;
      const fs = parseFloat(getComputedStyle(e).fontSize);
      if (fs > 14) e.style.fontSize = (fs * 0.94) + 'px';
    }
  }
}

const slides = DATA.slides || [];
let pointNo = 0;
const builders = {
  cover(s, b) { if (s.kicker) el('div', 'kick', s.kicker, b); return [el('p', 'title disp', s.title, b), s.accent ? el('p', 'accent disp', s.accent, b) : null]; },
  point(s, b) { pointNo++; el('p', 'n disp', String(pointNo).padStart(2, '0'), b); return [el('p', 't disp', s.title, b), s.text ? el('p', 'd', s.text, b) : null]; },
  list(s, b) {
    const t = el('p', 't disp', s.title, b), ul = el('ul', null, null, b);
    for (const it of (s.items || []).slice(0, 6)) { const li = el('li', null, null, ul); el('i', null, null, li); li.append(it); }
    return [t, ul];
  },
  stat(s, b) { return [el('p', 'num disp', s.num, b), el('p', 'lbl disp', s.label, b), s.text ? el('p', 'd', s.text, b) : null]; },
  quote(s, b) { el('div', 'mark disp', '“', b); return [el('p', 'q disp', s.text, b), s.by ? el('p', 'by', s.by, b) : null]; },
  cta(s, b) {
    const out = [el('p', 't disp', s.text, b), s.sub ? el('p', 'sub', s.sub, b) : null];
    if (s.keyword) { const dm = el('div', 'dm', 'Direktga yozing: ', b); el('b', null, s.keyword, dm); }
    const sig = el('div', 'sig', null, b);
    el('div', 'nm', DATA.signature?.name || '', sig); el('div', 'rl', DATA.signature?.role || '', sig);
    return out;
  }
};

async function build() {
  if (document.fonts) {
    const faces = ['400 16px Onest', '600 16px Onest', '700 16px Onest', '500 16px Unbounded', '800 16px Unbounded'];
    await Promise.all(faces.map(f => document.fonts.load(f, 'Oʻzbek').catch(() => {})));
    await document.fonts.ready;
  }
  const made = [];
  slides.forEach((s, i) => {
    const build = builders[s.type];
    if (!build) return;
    const sl = el('section', 'slide ' + s.type, null, document.body);
    el('div', 'grid', null, sl);
    const b = el('div', 'body', null, sl);
    const els = build(s, b);
    const foot = el('div', 'foot', null, sl);
    el('span', null, DATA.signature?.name || '', foot);
    el('span', 'pg', `${made.length + 1}/${slides.length}`, foot);
    if (s.type === 'cover' && slides.length > 1) el('div', 'swipe', 'Varaqlang →', sl);
    fitBody(b, els);
    made.push(sl);
  });
  // Sahifa raqami faqat haqiqiy slaydlar soniga qarab
  made.forEach((sl, i) => { sl.querySelector('.pg').textContent = made.length > 1 ? `${i + 1}/${made.length}` : ''; });
  return made.length;
}

if (RENDER) {
  window.__ready = build();
  window.__show = (i) => document.querySelectorAll('.slide').forEach((s, j) => s.classList.toggle('on', i === j));
} else {
  build();
}
</script>
</body>
</html>
