<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ekran shablon</title>
<style>
  @font-face { font-family: 'InterL'; font-weight: 800; src: url(fonts/inter800.ttf); }
  @font-face { font-family: 'InterL'; font-weight: 900; src: url(fonts/inter900.ttf); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B1020; }
  body { font-family: 'InterL', 'Noto Color Emoji', 'DejaVu Sans'; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(700px 600px at 20% 15%, rgba(99,102,241,.35), transparent 70%),
                radial-gradient(800px 700px at 85% 85%, rgba(245,159,0,.25), transparent 70%), #0B1020; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .kamera { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  .qurilma { position: absolute; background: #111; box-shadow: 0 50px 100px rgba(0,0,0,.55), inset 0 0 0 3px #3A3A3A; }
  .qurilma.telefon { left: 205px; top: 130px; width: 670px; height: 1380px; border-radius: 86px; padding: 22px; }
  .qurilma.telefon::before { content: ''; position: absolute; left: 50%; top: 40px; width: 170px; height: 44px; margin-left: -85px; border-radius: 22px; background: #000; z-index: 3; }
  .qurilma.kompyuter { left: 40px; top: 430px; width: 1000px; height: 650px; border-radius: 30px 30px 10px 10px; padding: 22px; }
  .taglik { position: absolute; left: -10px; top: 1080px; width: 1100px; height: 50px; border-radius: 0 0 40px 40px; background: linear-gradient(180deg, #C9CCD2, #8E9298); }
  .ekr { position: relative; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  .telefon .ekr { border-radius: 66px; }
  .kompyuter .ekr { border-radius: 10px; }
  .ekr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
  .halqa { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 8px solid #FFD43B; opacity: 0; z-index: 4; }
  .nuqta { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,212,59,.75); opacity: 0; z-index: 4; }
  svg.chiziq { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; z-index: 6; pointer-events: none; }
  .yorliq { position: absolute; padding: 18px 30px; border-radius: 26px; background: #FFD43B; color: #111; font-size: 46px; font-weight: 900; white-space: nowrap; z-index: 7; opacity: 0;
    box-shadow: 0 16px 36px rgba(0,0,0,.35); }
  .sub { position: absolute; left: 60px; right: 60px; top: 1570px; text-align: center; z-index: 8; }
  .sub .quti { display: inline-block; padding: 18px 32px; border-radius: 28px; background: #fff; color: #111; font-size: 58px; font-weight: 900; line-height: 1.14; letter-spacing: -1.5px; }
  .w { display: inline-block; opacity: 0; margin: 0 .12em; }
  .w.hl { background: #FFD43B; padding: 0 .12em; border-radius: .12em; }
  .w.yop { margin-left: -.1em !important; }
  #nik { position: absolute; left: 0; right: 0; top: 1790px; text-align: center; font-size: 38px; font-weight: 800; color: rgba(255,255,255,.55); z-index: 9; }
</style>
</head>
<body>
<div id="stage"><div id="nik"></div></div>
<script src="umumiy.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sozlar = (m) => { const chiq = []; let bosh = true;
  for (const q of String(m || '').split(/(\*[^*]+\*)/)) {
    if (!q) continue; const hl = /^\*[^*]+\*$/.test(q);
    for (const p of q.replace(/\*/g, '').split(/(\s+)/)) { if (!p) continue; if (/^\s+$/.test(p)) { bosh = true; continue; } chiq.push({ s: p, hl, yop: !bosh && chiq.length > 0 }); bosh = false; }
  }
  return chiq; };
const MARKAZ = { x: 540, y: 800 };

let SAHNALAR = [], JAMI = 0, HODISALAR = [];
window.hodisalar = () => HODISALAR.filter(x => x.t < JAMI);

// kamera holati: zoom kalit nuqtalari (kirish .6 s, ushlab turish d, chiqish .6 s)
function kamera(s, lt) {
  let k = 1, px = .5, py = .5, w = 0;
  for (const z of s.zoomlar || []) {
    const d = z.d ?? 2, kir = easeIO((lt - z.t) / .6), chiq = easeIO((lt - z.t - .6 - d) / .6);
    const q = kir * (1 - chiq);
    if (q > w) { w = q; k = z.k || 2; px = z.x ?? .5; py = z.y ?? .5; }
  }
  return { k: lerp(1, k, w), px, py, w };
}

window.init = async function (data) {
  await Promise.all(['900 60px InterL', '800 40px InterL'].map(f => document.fonts.load(f)));
  const stage = document.getElementById('stage');
  document.getElementById('nik').textContent = data.nik || '';
  const kutish = [];
  let t = 0;
  SAHNALAR = data.sahnalar.map((s, i) => {
    const dur = s.soniya || 5, tur = s.qurilma === 'kompyuter' ? 'kompyuter' : 'telefon';
    const el = document.createElement('div'); el.className = 'scene'; stage.insertBefore(el, document.getElementById('nik'));
    el.innerHTML = `<div class="kamera">${tur === 'kompyuter' ? '<div class="taglik"></div>' : ''}<div class="qurilma ${tur}"><div class="ekr"><img></div></div></div>
      <svg class="chiziq"></svg>${(s.izohlar || []).map(z => `<div class="yorliq">${esc(z.matn)}</div>`).join('')}
      ${s.subtitr ? `<div class="sub"><span class="quti">${sozlar(s.subtitr).map(w => `<span class="w${w.hl ? ' hl' : ''}${w.yop ? ' yop' : ''}">${esc(w.s)}</span>`).join('')}</span></div>` : ''}`;
    const ekr = el.querySelector('.ekr'), img = el.querySelector('img');
    (s.bosishlar || []).forEach(b => { ekr.insertAdjacentHTML('beforeend', `<div class="halqa" style="left:${b.x * 100}%;top:${b.y * 100}%"></div><div class="nuqta" style="left:${b.x * 100}%;top:${b.y * 100}%"></div>`); HODISALAR.push({ t: t + b.t, tur: 'klik' }); });
    (s.zoomlar || []).forEach(z => HODISALAR.push({ t: t + z.t, tur: 'whoosh' }));
    (s.izohlar || []).forEach(z => HODISALAR.push({ t: t + z.t, tur: 'pop' }));
    if (i > 0) HODISALAR.push({ t, tur: 'whoosh' });
    const kadrlar = Array.isArray(s.kadrlar) ? s.kadrlar : [];
    const bir = kadrlar.length ? null : (s.rasm || '');
    if (bir) { img.src = bir; kutish.push(img.decode().catch(() => {})); }
    else if (kadrlar.length) { img.src = kadrlar[0]; kutish.push(img.decode().catch(() => {})); }
    const q = el.querySelector('.qurilma');
    const x = { el, s, dur, bosh: t, img, kadrlar, joriy: 0, kam: el.querySelector('.kamera'), qur: q, ekr, svg: el.querySelector('svg.chiziq'),
      yorliq: [...el.querySelectorAll('.yorliq')], halqa: [...el.querySelectorAll('.halqa')], nuqta: [...el.querySelectorAll('.nuqta')],
      ws: [...el.querySelectorAll('.sub .w')], sub: el.querySelector('.sub') };
    t += dur; return x;
  });
  JAMI = t;
  await Promise.race([Promise.all(kutish), new Promise(r => setTimeout(r, 20000))]);
  SAHNALAR.forEach(x => { const r = x.ekr.getBoundingClientRect(); x.E = { x: r.left, y: r.top, w: r.width, h: r.height }; });
  return JAMI;
};

window.render = async function (t) {
  for (const [i, s] of SAHNALAR.entries()) {
    const lt = t - s.bosh, oxirgi = i === SAHNALAR.length - 1;
    const kor = lt >= 0 && (oxirgi || lt < s.dur);
    if (!kor) { s.el.style.opacity = 0; continue; }
    s.el.style.opacity = clamp(lt / .2);
    // ekrandagi kadr (ekran yozuvidan)
    if (s.kadrlar.length) {
      const k = Math.min(s.kadrlar.length - 1, Math.floor(lt * 30));
      if (k !== s.joriy) { s.joriy = k; s.img.src = s.kadrlar[k]; try { await s.img.decode(); } catch {} }
    }
    // kamera: nuqtani markazga olib keladi
    const c = kamera(s.s, lt), E = s.E;
    const Px = E.x + E.w * c.px, Py = E.y + E.h * c.py;
    const kir = ease(lt / .5), bazaK = lerp(.9, 1, kir);
    const K = c.k * bazaK, tx = (MARKAZ.x - Px * K) * c.w + (540 - 540 * bazaK) * (1 - c.w), ty = (MARKAZ.y - Py * K) * c.w + (900 - 900 * bazaK) * (1 - c.w) + lerp(120, 0, kir);
    s.kam.style.transform = `translate(${tx}px, ${ty}px) scale(${K})`;
    const nuqtaJoy = (x, y) => ({ x: (E.x + E.w * x) * K + tx, y: (E.y + E.h * y) * K + ty });
    // bosishlar
    (s.s.bosishlar || []).forEach((b, j) => {
      const q = (lt - b.t) / .6;
      s.halqa[j].style.opacity = q > 0 && q < 1 ? 1 - q : 0; s.halqa[j].style.transform = `scale(${lerp(.3, 1.4, ease(q))})`;
      s.nuqta[j].style.opacity = q > 0 && q < 1.3 ? 1 - q / 1.3 : 0;
    });
    // izohlar: yorliq + strelka nuqtaga
    let svg = '';
    (s.s.izohlar || []).forEach((z, j) => {
      const d = z.d ?? 2.5, q = (lt - z.t) / .35, o = clamp(q * 3) * clamp((z.t + d - lt) / .3);
      const P = nuqtaJoy(z.x ?? .5, z.y ?? .5), el = s.yorliq[j];
      const w = el.offsetWidth, h = el.offsetHeight, yuqori = P.y > 700;
      const lx = clamp(P.x - w / 2, 40, 1040 - w), ly = yuqori ? P.y - 230 - h : P.y + 200;
      el.style.left = lx + 'px'; el.style.top = ly + 'px'; el.style.opacity = o; el.style.transform = `scale(${lerp(.6, 1, ease(q))})`;
      if (o > 0) {
        const ax = lx + w / 2, ay = yuqori ? ly + h : ly, L = ease((lt - z.t - .15) / .35);
        const ex = lerp(ax, P.x, L), ey = lerp(ay, P.y + (yuqori ? -30 : 30), L);
        svg += `<path d="M${ax} ${ay} L${ex} ${ey}" stroke="#FFD43B" stroke-width="8" stroke-linecap="round" opacity="${o}"/><circle cx="${P.x}" cy="${P.y}" r="${22 * L}" fill="none" stroke="#FFD43B" stroke-width="7" opacity="${o}"/>`;
      }
    });
    s.svg.innerHTML = svg;
    if (s.sub) { const n = s.ws.length, oy = Math.max(.6, s.dur * .45); s.ws.forEach((w, k) => { const q = (lt - .2 - (k / n) * oy) / .16; w.style.opacity = clamp(q); w.style.transform = `translateY(${lerp(20, 0, ease(q))}px)`; }); }
  }
};
</script>
</body>
</html>
