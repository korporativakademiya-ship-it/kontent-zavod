<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Doska shablon</title>
<style>
  @font-face { font-family: 'InterL'; font-weight: 800; src: url(fonts/inter800.ttf); }
  @font-face { font-family: 'InterL'; font-weight: 900; src: url(fonts/inter900.ttf); }
  @font-face { font-family: 'Marker'; src: url(fonts/caveat.ttf); font-weight: 400 700; }
  @font-face { font-family: 'Ruchka'; src: url(fonts/kalam700.ttf); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #DDD; }
  body { font-family: 'InterL', 'Noto Color Emoji', 'DejaVu Sans'; color: #111; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .ichki { position: absolute; inset: 0; transform-origin: 50% 40%; }

  /* oq doska: alyumin ramka, ozgina o'chirilgan dog'lar */
  .fon-doska { background:
      radial-gradient(420px 160px at 25% 30%, rgba(120,130,150,.07), transparent 70%),
      radial-gradient(500px 200px at 75% 70%, rgba(120,130,150,.06), transparent 70%),
      linear-gradient(160deg, #FFFFFF 0%, #F4F6F8 55%, #ECEFF2 100%); }
  .fon-doska::before { content: ''; position: absolute; inset: 0; border: 30px solid; pointer-events: none;
    border-image: linear-gradient(135deg, #F2F2F2, #A9ADB3 30%, #E8E8E8 55%, #8E9298 80%, #D6D6D6) 1;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.08), inset 0 10px 30px rgba(0,0,0,.06); }
  .fon-doska::after { content: ''; position: absolute; left: 30px; right: 30px; top: 30px; height: 120px; background: linear-gradient(180deg, rgba(255,255,255,.7), transparent); }

  /* daftar: chiziqlar, qizil hoshiya, spiral */
  .fon-daftar { background:
      linear-gradient(90deg, transparent 158px, rgba(224,49,49,.55) 158px, rgba(224,49,49,.55) 161px, transparent 161px),
      repeating-linear-gradient(180deg, transparent 0 62px, rgba(70,120,210,.28) 62px 64px),
      #FFFDF4; background-position: 0 0, 0 196px, 0 0; }
  .spiral { position: absolute; left: 22px; width: 60px; height: 28px; border-radius: 14px; border: 6px solid #9EA3AA; background: transparent; box-shadow: inset 0 2px 3px rgba(0,0,0,.2); }
  .spiral::before { content: ''; position: absolute; left: 36px; top: 1px; width: 14px; height: 14px; border-radius: 50%; background: #3A3A3A; }

  svg.qatlam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  svg.qatlam path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .yoz { position: absolute; white-space: nowrap; line-height: 1.05; }
  .yoz.marker { font-family: 'Marker'; font-weight: 700; }
  .yoz.ruchka { font-family: 'Ruchka'; font-weight: 700; }
  .hl { position: absolute; background: rgba(255,212,59,.55); border-radius: 8px; transform-origin: 0 50%; mix-blend-mode: multiply; }

  .sub { position: absolute; left: 60px; right: 60px; top: 1360px; text-align: center; }
  .sub .quti { display: inline-block; padding: 20px 34px; border-radius: 30px; background: rgba(255,255,255,.93); box-shadow: 0 10px 30px rgba(0,0,0,.1);
    font-size: 68px; font-weight: 900; line-height: 1.14; letter-spacing: -1.5px; }
  .w { display: inline-block; opacity: 0; margin: 0 .12em; }
  .w.hl2 { background: linear-gradient(transparent 58%, #FFD43B 58%, #FFD43B 92%, transparent 92%); padding: 0 .06em; }
  #nik { position: absolute; left: 0; right: 0; top: 1740px; text-align: center; font-size: 40px; font-weight: 800; color: #7A7F87; z-index: 5; }
  #qalam { position: absolute; left: 0; top: 0; width: 70px; height: 330px; transform-origin: 35px 330px; z-index: 10; filter: drop-shadow(18px 22px 14px rgba(0,0,0,.25)); }
  .w.yop { margin-left: -.1em !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="nik"></div>
  <svg id="qalam" viewBox="0 0 70 330">
    <path d="M35 330 L24 292 L46 292 Z" id="uch" fill="#111"/>
    <rect x="18" y="250" width="34" height="46" rx="6" fill="#2E2E2E"/>
    <rect x="12" y="70" width="46" height="190" rx="14" fill="#F4F4F4" stroke="#CFCFCF" stroke-width="2"/>
    <rect x="12" y="150" width="46" height="44" fill="#E9E9E9"/>
    <rect x="10" y="0" width="50" height="86" rx="16" id="qopqoq" fill="#111"/>
    <rect x="20" y="100" width="8" height="140" rx="4" fill="#fff" opacity=".8"/>
  </svg>
</div>
<script src="umumiy.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SIYOH = { qora: '#1B1B1D', kok: '#1D4ED8', qizil: '#E03131', yashil: '#2B8A3E', sariq: '#F59F00' };

// ---------- qo'lda chizilgandek yo'llar (seed bilan — har renderda bir xil) ----------
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const j = (r) => (rnd() - .5) * 2 * r;
const chiziqD = (x1, y1, x2, y2, r = 3) => { const mx = (x1 + x2) / 2 + j(r * 2), my = (y1 + y2) / 2 + j(r * 2); return `M${x1 + j(r)} ${y1 + j(r)} Q${mx} ${my} ${x2 + j(r)} ${y2 + j(r)}`; };
function qutiD(x, y, w, h) {
  const p = [[x + j(4), y + j(4)], [x + w + j(4), y + j(4)], [x + w + j(4), y + h + j(4)], [x + j(4), y + h + j(4)]];
  let d = `M${p[0][0] - 6} ${p[0][1] + 3}`;
  for (let i = 1; i <= 4; i++) { const a = p[i - 1], b = p[i % 4]; d += ` Q${(a[0] + b[0]) / 2 + j(5)} ${(a[1] + b[1]) / 2 + j(5)} ${b[0]} ${b[1]}`; }
  return d + ` L${p[0][0] + 14} ${p[0][1] - 4}`;
}
function aylanaD(cx, cy, rx, ry) {
  const a0 = -2.6 + j(.3); let d = '';
  for (let a = a0, k = 0; a <= a0 + Math.PI * 2 + .45; a += .07, k++) {
    const f = 1 + Math.sin(a * 2 + 1) * .03 + (a - a0) * .012;
    d += `${k ? 'L' : 'M'}${(cx + Math.cos(a) * rx * f).toFixed(1)} ${(cy + Math.sin(a) * ry * f).toFixed(1)}`;
  }
  return d;
}
function tagD(x, y, w) { let d = `M${x} ${y}`; const n = Math.max(3, Math.round(w / 60)); for (let i = 1; i <= n; i++) d += ` Q${x + (i - .5) * w / n} ${y + (i % 2 ? 9 : -9)} ${x + i * w / n} ${y + j(2)}`; return d; }
function strelkaD(x1, y1, x2, y2, bukil = 60) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (x1 + x2) / 2 + nx * bukil, cy = (y1 + y2) / 2 + ny * bukil;
  const a = Math.atan2(y2 - cy, x2 - cx), u = 36;
  return [`M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`,
    `M${x2 + Math.cos(a + 2.6) * u} ${y2 + Math.sin(a + 2.6) * u} L${x2} ${y2}`,
    `M${x2 + Math.cos(a - 2.6) * u} ${y2 + Math.sin(a - 2.6) * u} L${x2} ${y2}`];
}
const xD = (cx, cy, s = 34) => [chiziqD(cx - s, cy - s, cx + s, cy + s, 2), chiziqD(cx + s, cy - s, cx - s, cy + s, 2)];
const tikD = (cx, cy, s = 34) => `M${cx - s} ${cy} L${cx - s * .3} ${cy + s * .7} L${cx + s * 1.1} ${cy - s * .9}`;

const sozlar = (m) => { const chiq = []; let bosh = true;
  for (const q of String(m || '').split(/(\*[^*]+\*)/)) {
    if (!q) continue; const hl = /^\*[^*]+\*$/.test(q);
    for (const p of q.replace(/\*/g, '').split(/(\s+)/)) { if (!p) continue; if (/^\s+$/.test(p)) { bosh = true; continue; } chiq.push({ s: p, hl, yop: !bosh && chiq.length > 0 }); bosh = false; }
  }
  return chiq; };

// ---------- sahna quruvchisi: elementlar va chizish navbati ----------
function Quruvchi(el) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'qatlam');
  el.appendChild(svg);
  const navbat = [];
  const api = {
    yol(d, { siyoh = 'qora', qalinlik = 9, dur = .6, keyin = 0 } = {}) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d); p.setAttribute('stroke', SIYOH[siyoh] || siyoh); p.setAttribute('stroke-width', qalinlik);
      svg.appendChild(p); const L = p.getTotalLength(); p.style.strokeDasharray = `${L} ${L + 10}`; p.style.strokeDashoffset = L;
      navbat.push({ tur: 'yol', el: p, L, dur, keyin, siyoh }); return p;
    },
    // qo'lyozma matn; maxW dan sig'masa shrift kichrayadi. Joylashuvi qaytadi.
    yoz(matn, { x, y, o = 90, uslub = 'marker', siyoh = 'qora', markaz = false, maxW = 900, keyin = 0, ikkiQator = false } = {}) {
      const d = document.createElement('div'); d.className = `yoz ${uslub}`;
      d.innerHTML = String(matn).split(/(\*[^*]+\*)/).filter(Boolean).map(q => /^\*[^*]+\*$/.test(q) ? `<span class="urgu">${esc(q.slice(1, -1))}</span>` : esc(q)).join('');
      d.style.fontSize = o + 'px'; d.style.color = SIYOH[siyoh] || siyoh; el.appendChild(d);
      // sig'masa: avval ikki qatorga bo'linadi (so'z chegarasidan), keyin shrift kichrayadi
      if (ikkiQator && d.scrollWidth > maxW && !/\*/.test(matn)) {
        const w = String(matn).split(' '); let eng = 1, farq = 1e9;
        for (let i = 1; i < w.length; i++) { const f = Math.abs(w.slice(0, i).join(' ').length - w.slice(i).join(' ').length); if (f < farq) { farq = f; eng = i; } }
        d.innerHTML = `${esc(w.slice(0, eng).join(' '))}<br>${esc(w.slice(eng).join(' '))}`;
      }
      let f = o; while (d.scrollWidth > maxW && f > 30) { f -= 3; d.style.fontSize = f + 'px'; }
      const w = d.scrollWidth, h = d.offsetHeight;
      d.style.left = (markaz ? x - w / 2 : x) + 'px'; d.style.top = y + 'px';
      navbat.push({ tur: 'yoz', el: d, dur: clamp(String(matn).length * .045, .4, 1.6), keyin, siyoh, x: markaz ? x - w / 2 : x, y, w, h });
      return { x: markaz ? x - w / 2 : x, y, w, h, el: d };
    },
    marker(x, y, w, h, { keyin = 0 } = {}) {
      const d = document.createElement('div'); d.className = 'hl';
      Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      el.appendChild(d);
      navbat.push({ tur: 'hl', el: d, dur: .45, keyin, siyoh: 'sariq', x, y: y + h / 2, w, h: 0 });
    },
    navbat,
  };
  return api;
}

function urguQutisi(blok, el) {
  const s = blok.el.querySelector('.urgu'); if (!s) return null;
  const a = s.getBoundingClientRect(), b = el.getBoundingClientRect();
  return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height };
}

const TURLAR = {
  // Katta sarlavha: *so'z* qizil aylana bilan, oxirgi qator tagiga chiziladi
  sarlavha(q, s, el) {
    const n = s.qatorlar.length, y0 = 560 - (n - 1) * 80;
    s.qatorlar.forEach((m, i) => {
      const b = q.yoz(m, { x: 540, y: y0 + i * 165, o: 140, markaz: true, maxW: 900, siyoh: i === n - 1 && s.kok ? 'kok' : 'qora' });
      const u = urguQutisi(b, el);
      if (u) q.yol(aylanaD(u.x + u.w / 2, u.y + u.h / 2 + 6, u.w / 2 + 34, u.h / 2 + 8), { siyoh: 'qizil', qalinlik: 8, dur: .55 });
      if (i === n - 1) q.yol(tagD(b.x + 10, b.y + b.h + 12, b.w - 20), { siyoh: 'qizil', qalinlik: 8, dur: .45 });
    });
  },

  // Daftarda hisob-kitob: har qator chiziq ustida, natija qizil va aylana ichida
  hisob(q, s, el) {
    const Y = (k) => 196 + k * 128 - 88;
    s.qatorlar.forEach((m, i) => {
      const b = q.yoz(m, { x: 200, y: Y(i + 2), o: 64, uslub: 'ruchka', siyoh: 'kok', maxW: 850 });
      const u = urguQutisi(b, el); if (u) q.marker(u.x - 8, u.y + 8, u.w + 16, u.h - 10);
    });
    const k = s.qatorlar.length + 2;
    q.yol(chiziqD(190, Y(k) - 6, 1000, Y(k) - 10, 2), { siyoh: 'qora', qalinlik: 6, dur: .35 });
    const r = q.yoz(s.natija, { x: 200, y: Y(k) + 20, o: 84, uslub: 'ruchka', siyoh: 'qizil', maxW: 800 });
    q.yol(aylanaD(r.x + r.w / 2, r.y + r.h / 2 + 4, r.w / 2 + 50, r.h / 2 + 26), { siyoh: 'qizil', qalinlik: 7, dur: .6 });
    if (s.izoh) q.yoz(s.izoh, { x: 560, y: Y(k + 2) + 20, o: 76, uslub: 'marker', siyoh: 'qizil', markaz: true, maxW: 800 });
  },

  // Doskada jarayon: qutilar zig-zag, orasida strelkalar; oxirgisi yomon (qizil ✗) yoki yaxshi (yashil ✓)
  oqim(q, s) {
    const n = s.qadamlar.length, W = 560, H = 160, qadam = Math.min(300, 1000 / n);
    const joy = s.qadamlar.map((_, i) => ({ x: i % 2 ? 420 : 100, y: 190 + i * qadam }));
    s.qadamlar.forEach((m, i) => {
      const oxirgi = i === n - 1, rang = oxirgi ? (s.yakun === 'yomon' ? 'qizil' : s.yakun === 'yaxshi' ? 'yashil' : 'qora') : 'qora';
      const { x, y } = joy[i];
      q.yol(qutiD(x, y, W, H), { siyoh: rang, qalinlik: 8, dur: .55 });
      q.yoz(m, { x: x + W / 2, y: y + 30, o: 84, markaz: true, maxW: W - 50, siyoh: rang });
      if (oxirgi && s.yakun === 'yomon') xD(x + W + 60, y + H / 2).forEach(d => q.yol(d, { siyoh: 'qizil', qalinlik: 12, dur: .2 }));
      if (oxirgi && s.yakun === 'yaxshi') q.yol(tikD(x - 70 + (i % 2 ? 0 : W + 140), y + H / 2), { siyoh: 'yashil', qalinlik: 13, dur: .3 });
      if (!oxirgi) {
        const a = joy[i], b = joy[i + 1];
        const [m1, h1, h2] = strelkaD(a.x + W / 2 + (i % 2 ? -120 : 120), a.y + H + 14, b.x + W / 2 + (i % 2 ? 120 : -120), b.y - 14, i % 2 ? -50 : 50);
        q.yol(m1, { qalinlik: 7, dur: .4 }); q.yol(h1, { qalinlik: 7, dur: .1 }); q.yol(h2, { qalinlik: 7, dur: .1 });
      }
    });
  },

  // Daftarda taqqoslash: Oldin ✗ | Keyin ✓
  taqqos(q, s) {
    const Y = (k) => 196 + k * 128 - 88;
    q.yoz(s.chap || 'Oldin', { x: 370, y: Y(1), o: 84, uslub: 'marker', siyoh: 'qizil', markaz: true, maxW: 380 });
    q.yoz(s.ong || 'Keyin', { x: 800, y: Y(1), o: 84, uslub: 'marker', siyoh: 'yashil', markaz: true, maxW: 380 });
    q.yol(chiziqD(590, Y(1) - 10, 590, Y(2 + s.qatorlar.length * 1.5), 3), { qalinlik: 6, dur: .4 });
    q.yol(chiziqD(180, Y(2) - 4, 1010, Y(2) - 8, 2), { qalinlik: 6, dur: .35 });
    s.qatorlar.forEach(([a, b], i) => {
      const y = Y(2) + 30 + i * 192;
      q.yoz(a, { x: 200, y, o: 54, uslub: 'ruchka', siyoh: 'qora', maxW: 320, ikkiQator: true });
      xD(555, y + 36, 16).forEach(d => q.yol(d, { siyoh: 'qizil', qalinlik: 8, dur: .12 }));
      q.yoz(b, { x: 620, y, o: 54, uslub: 'ruchka', siyoh: 'kok', maxW: 330, ikkiQator: true });
      q.yol(tikD(990, y + 36, 20), { siyoh: 'yashil', qalinlik: 9, dur: .2 });
    });
  },

  cta(q, s) {
    const b = q.yoz(s.soz || 'KOTIB', { x: 540, y: 360, o: 250, markaz: true, maxW: 900 });
    q.yol(aylanaD(b.x + b.w / 2, b.y + b.h / 2 + 10, b.w / 2 + 70, b.h / 2 + 30), { siyoh: 'qizil', qalinlik: 11, dur: .6 });
    q.yoz(s.matn || "Direct'ga yozing", { x: 540, y: 820, o: 110, markaz: true, maxW: 900, siyoh: 'kok' });
    const [m1, h1, h2] = strelkaD(540, 980, 540, 1250, 40);
    q.yol(m1, { siyoh: 'qizil', qalinlik: 10, dur: .35 }); q.yol(h1, { siyoh: 'qizil', qalinlik: 10, dur: .1 }); q.yol(h2, { siyoh: 'qizil', qalinlik: 10, dur: .1 });
  },
};

// ---------- vaqt jadvali va render ----------
let SAHNALAR = [], JAMI = 0, HODISALAR = [];
window.hodisalar = () => HODISALAR.filter(x => x.t < JAMI);
const qalam = document.getElementById('qalam');
const QOPQOQ = document.getElementById('qopqoq'), UCH = document.getElementById('uch');
const QOLDA = { x: 1250, y: 2150 };

function uchi(it, p) { // qalam uchi qayerda
  if (it.tur === 'yol') { const pt = it.el.getPointAtLength(it.L * clamp(p)); return { x: pt.x, y: pt.y }; }
  return { x: it.x + it.w * clamp(p), y: it.y + it.h * .78 + Math.sin(p * 60) * 7 };
}

window.init = async function (data) {
  await Promise.all(['700 140px Marker', '700 60px Ruchka', '900 60px InterL', '800 40px InterL'].map(f => document.fonts.load(f)));
  const stage = document.getElementById('stage');
  document.getElementById('nik').textContent = data.nik || '';
  let t = 0;
  SAHNALAR = data.sahnalar.map((s, si) => {
    seed = 1000 + si * 97;
    const el = document.createElement('div'); el.className = 'scene'; stage.insertBefore(el, document.getElementById('nik'));
    const ichki = document.createElement('div'); ichki.className = `ichki fon-${s.fon || 'doska'}`; el.appendChild(ichki);
    if (s.fon === 'daftar') for (let y = 90; y < 1900; y += 110) ichki.insertAdjacentHTML('beforeend', `<div class="spiral" style="top:${y}px"></div>`);
    const q = Quruvchi(ichki);
    (TURLAR[s.tur] || TURLAR.sarlavha)(q, s, ichki);
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.innerHTML = `<span class="quti">${sozlar(s.subtitr || '').map(w => `<span class="w${w.hl ? ' hl2' : ''}${w.yop ? ' yop' : ''}">${esc(w.s)}</span>`).join('')}</span>`;
    el.appendChild(sub);
    // chizish navbati: ketma-ket, sahnaning 85% iga sig'diriladi
    const dur = s.soniya || 5, bosh = .35, tanaffus = .1;
    const kerak = q.navbat.reduce((a, it) => a + it.dur + tanaffus, 0);
    const k = Math.min(1, (dur * .85 - bosh) / kerak);
    let c = bosh; q.navbat.forEach(it => { it.bosh = c; it.dur *= k; c += it.dur + tanaffus * k; });
    q.navbat.forEach(it => HODISALAR.push(it.dur < .16 ? { t: t + it.bosh, tur: 'tik' } : { t: t + it.bosh, tur: 'yoz', d: it.dur }));
    if (si > 0) HODISALAR.push({ t, tur: 'whoosh' });
    q.navbat.forEach(it => { if (it.tur === 'yoz') it.el.style.clipPath = 'inset(-20px 100% -20px -20px)'; if (it.tur === 'hl') it.el.style.transform = 'scaleX(0)'; });
    const x = { el, ichki, navbat: q.navbat, sozlar: [...sub.querySelectorAll('.w')], bosh: t, dur, sub };
    t += dur; return x;
  });
  JAMI = t;
  return JAMI;
};

window.render = function (t) {
  let qalamJoy = null, qalamSiyoh = 'qora';
  SAHNALAR.forEach((s, i) => {
    const lt = t - s.bosh, oxirgi = i === SAHNALAR.length - 1;
    const kor = lt >= 0 && (oxirgi || lt < s.dur);
    if (!kor) { s.el.style.opacity = 0; return; }
    const kir = ease(lt / .35);
    s.el.style.opacity = clamp(lt / .2);
    s.el.style.transform = `translateX(${lerp(90, 0, kir)}px)`;
    const sc = 1 + lt * .006, sx = lerp(90, 0, kir);
    s.ichki.style.transform = `scale(${sc})`;
    const joyla = (p) => ({ ...p, x: 540 + (p.x - 540) * sc + sx, y: 768 + (p.y - 768) * sc });
    for (const it of s.navbat) {
      const p = clamp((lt - it.bosh) / it.dur);
      if (it.tur === 'yol') it.el.style.strokeDashoffset = it.L * (1 - easeIO(p));
      if (it.tur === 'yoz') it.el.style.clipPath = p >= 1 ? 'none' : `inset(-20px ${100 - p * 100}% -20px -20px)`;
      if (it.tur === 'hl') it.el.style.transform = `scaleX(${ease(p)})`;
    }
    // qalam: faol elementning uchida; oraliqda keyingisiga uchadi
    const N = s.navbat;
    if (N.length) {
      const f = N.findIndex(it => lt < it.bosh + it.dur);
      if (f === -1) {
        const o = N[N.length - 1], e = uchi(o, 1), q = ease((lt - o.bosh - o.dur) / .6);
        qalamJoy = joyla({ x: lerp(e.x, QOLDA.x, q), y: lerp(e.y, QOLDA.y, q), kot: 0 });
      } else if (lt >= N[f].bosh) {
        qalamJoy = joyla({ ...uchi(N[f], easeIO((lt - N[f].bosh) / N[f].dur)), kot: 0 }); qalamSiyoh = N[f].siyoh;
      } else {
        const a = f ? uchi(N[f - 1], 1) : QOLDA, b = uchi(N[f], 0);
        const q0 = f ? N[f - 1].bosh + N[f - 1].dur : 0, q = easeIO((lt - q0) / Math.max(.05, N[f].bosh - q0));
        qalamJoy = joyla({ x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), kot: Math.sin(q * Math.PI) }); qalamSiyoh = N[f].siyoh;
      }
    }
    const n = s.sozlar.length, oyna = Math.max(.6, s.dur * .5);
    s.sozlar.forEach((w, k) => {
      const q = (lt - .15 - (k / n) * oyna) / .16;
      w.style.opacity = clamp(q); w.style.transform = `translateY(${lerp(24, 0, ease(q))}px) scale(${lerp(1.2, 1, ease(q))})`;
    });
    s.sub.style.opacity = clamp(lt / .2);
  });
  if (qalamJoy) {
    const rang = SIYOH[qalamSiyoh] || '#111';
    QOPQOQ.setAttribute('fill', rang); UCH.setAttribute('fill', rang);
    const kot = qalamJoy.kot * 40; // oraliqda qalam ko'tariladi
    qalam.style.transform = `translate(${qalamJoy.x - 35}px, ${qalamJoy.y - 330 - kot}px) rotate(${28 + kot * .15}deg)`;
    qalam.style.opacity = 1;
  } else qalam.style.opacity = 0;
};
</script>
